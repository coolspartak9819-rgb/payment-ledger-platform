name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23.x' }
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - run: go build ./cmd/api ./cmd/worker
      - run: go build ./scripts/load.go
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.out }
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: payments, POSTGRES_PASSWORD: payments, POSTGRES_DB: payments }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 5s --health-timeout 3s --health-retries 10
      nats:
        image: nats:2.10-alpine
        ports: [4222:4222]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23.x' }
      - run: DATABASE_URL=postgresql://payments:payments@localhost:5432/payments go run ./cmd/migrate
      - run: TEST_DATABASE_URL=postgresql://payments:payments@localhost:5432/payments go test ./internal/store -run Postgres
      - run: DATABASE_URL=postgresql://payments:payments@localhost:5432/payments NATS_URL=nats://localhost:4222 MERCHANT_API_KEYS=e2e-key:e2e-merchant go run ./cmd/api > api.log 2>&1 &
      - run: for i in $(seq 1 20); do curl -fsS http://localhost:8080/readyz && break || sleep 1; done
      - run: E2E_MERCHANT_API_KEY=e2e-key sh scripts/e2e.sh
      - if: always()
        run: cat api.log || true
