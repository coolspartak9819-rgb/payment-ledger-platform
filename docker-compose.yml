services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://payments:payments@postgres:5432/payments
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      MERCHANT_API_KEYS: ${MERCHANT_API_KEYS:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      MERCHANT_WEBHOOK_URL: ${MERCHANT_WEBHOOK_URL:-}
      MERCHANT_WEBHOOK_SECRET: ${MERCHANT_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    build: .
    entrypoint: ["/payment-worker"]
    environment:
      DATABASE_URL: postgresql://payments:payments@postgres:5432/payments
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_payment_ledger.sql:/docker-entrypoint-initdb.d/001_payment_ledger.sql:ro
      - ./migrations/002_partial_payments.sql:/docker-entrypoint-initdb.d/002_partial_payments.sql:ro
      - ./migrations/003_payouts.sql:/docker-entrypoint-initdb.d/003_payouts.sql:ro
  redis:
    image: redis:7-alpine
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    volumes: ["nats-data:/data"]
volumes:
  postgres-data:
  nats-data:
